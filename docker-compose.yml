services:
    # ───────────────────────────────────────────────────────────────
    # PHP - Laravel Application Service
    # ───────────────────────────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: ./docker/app/Dockerfile
            args:
                user: ${USER:-root}
                uid: ${UID:-0}
                gid: ${GID:-1}
                group: ${GROUP:-rootgroup}
        container_name: ${SUFFIX_APP_NAME:-app}-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/php.ini
        networks:
            - app_network

    # ───────────────────────────────────────────────────────────────
    # MariaDB Database
    # ───────────────────────────────────────────────────────────────
    mariadb:
        image: mariadb:11.8.2
        container_name: ${SUFFIX_APP_NAME:-app}-mariadb
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_DATABASE: ${DB_DATABASE:-app}
            MYSQL_USER: ${DB_USERNAME:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${MARIADB_EXPOSE_PORT:-3306}:3306"
        volumes:
            - ./docker/mariadb:/var/lib/mysql
        networks:
            - app_network

    # ───────────────────────────────────────────────────────────────
    # Nginx Web Server
    # ───────────────────────────────────────────────────────────────
    nginx:
        image: nginx:1.28-alpine
        container_name: ${SUFFIX_APP_NAME:-app}-webserver
        restart: unless-stopped
        ports:
            - "${NGINX_EXPOSE_PORT:-80}:80"
            - "${NGINX_SSL_EXPOSE_PORT:-443}:443"
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d/
        depends_on:
            - app
        networks:
            app_network:
                aliases:
                    - ${SUFFIX_APP_NAME:-app}.local.command

# ───────────────────────────────────────────────────────────────
# Docker Networks
# ───────────────────────────────────────────────────────────────
networks:
    app_network:
        driver: bridge
